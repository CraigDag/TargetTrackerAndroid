# Every version used by the build is pinned here, and only here.
[versions]
kotlin = "2.1.21"
kotlinx-serialization = "1.8.1"
junit = "5.11.4"
# One OpenCV version everywhere. Desktop gets natives from the openpnp bundle
# (its version string carries a "-0" packaging suffix); Android uses the
# official OpenCV Android SDK at the same OpenCV version.
opencv = "4.9.0"
openpnp-opencv = "4.9.0-0"
# Phone app (android/)
agp = "8.10.1"
compose-bom = "2025.05.01"
activity-compose = "1.10.1"
navigation-compose = "2.9.0"
lifecycle = "2.9.0"
core-ktx = "1.16.0"
exifinterface = "1.4.1"
coroutines = "1.10.2"

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
opencv-desktop = { module = "org.openpnp:opencv", version.ref = "openpnp-opencv" }
opencv-android = { module = "org.opencv:opencv", version.ref = "opencv" }
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons = { module = "androidx.compose.material:material-icons-core" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation-compose" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exifinterface" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
