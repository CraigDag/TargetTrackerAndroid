name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Kotlin build and tests
        run: ./gradlew :core:build :desktop:build
      - name: Desktop smoke test on the real photo
        run: |
          ./gradlew :desktop:installDist
          desktop/build/install/rangetarget/bin/rangetarget version
          desktop/build/install/rangetarget/bin/rangetarget smoke test_data/real/2026-11-21_card01_final.jpg --rotate left
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python tool tests
        run: |
          pip install -r tools/requirements.txt
          pytest tools

  android:
    # The phone app, built as an installable test APK (sideload).
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the test APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew :android:assembleRelease
      - name: Name the APK
        run: |
          mkdir -p apk
          cp android/build/outputs/apk/release/android-release.apk "apk/range-target-test-${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: range-target-test-apk
          path: apk/*.apk
          retention-days: 30
      - name: Publish the APK as a test release (download it from the Releases page on the phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "test-build-${{ github.run_number }}" apk/*.apk --prerelease \
            --target "${{ github.event.pull_request.head.sha || github.sha }}" \
            --title "Test build ${{ github.run_number }}" \
            --notes "Test APK for sideloading, built from ${{ github.head_ref || github.ref_name }} at ${{ github.event.pull_request.head.sha || github.sha }}. Open this page on the phone, tap the .apk file, then install it."

  android-check:
    # Runs the app on an emulator: sample session with no taps, screenshots of the main screens.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build an emulator APK
        run: ./gradlew :android:assembleRelease -Pabis=x86_64
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/emulator-check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-screenshots
          path: shots/
          retention-days: 14
